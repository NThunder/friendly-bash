[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "friendly-bash"
version = "0.1.0"
description = "A friendly shell that understands natural language — when bash doesn't know, LLM does"
authors = [
    {name = "Grigory Bukhtuev"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
friendly-bash = "friendly_bash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
